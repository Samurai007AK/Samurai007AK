name: daily ink

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw today's images
        run: python scripts/daily.py dist
        env:
          # Read-only fine-grained token so private repos count toward the numbers.
          # Falls back to the built-in token (public data only) if the secret is missing.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
      # One commit on an orphan branch, force-pushed, so history never grows and main stays untouched.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Daily ink $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
